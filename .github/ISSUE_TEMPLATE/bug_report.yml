name: Bug report
description: Laporkan bug yang dapat direproduksi.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gunakan template ini untuk bug yang dapat direproduksi.
        Untuk security issue, jangan membuat public issue; gunakan jalur security reporting.

  - type: textarea
    id: description
    attributes:
      label: Deskripsi
      description: Apa yang terjadi?
      placeholder: Jelaskan bug secara jelas.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      description: Langkah minimal untuk mereproduksi bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Sertakan OS, browser, commit/branch, dan versi relevan.
      placeholder: |
        OS:
        Browser:
        Commit:
        PHP:
        Node:
        Docker:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
